<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <span class="login-icon">🔐</span>
      <h1>Compra/Venta USD</h1>
      <p>BCV → Zinli → Binance</p>
    </div>

    <h2>{{ modo === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta' }}</h2>

    <div class="form-group" *ngIf="modo === 'registro'">
      <label>👤 Nombre</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Tu nombre" class="input" />
    </div>

    <div class="form-group">
      <label>📧 Correo Gmail</label>
      <input type="email" [(ngModel)]="email" placeholder="ejemplo@gmail.com" class="input" />
    </div>

    <div class="form-group">
      <label>🔒 Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="Mínimo 4 caracteres" class="input" (keyup.enter)="submit()" />
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <button class="btn-submit" (click)="submit()" [disabled]="loading">
      {{ loading ? '⏳ Procesando...' : (modo === 'login' ? '🚀 Iniciar Sesión' : '📝 Crear Cuenta') }}
    </button>

    <p class="toggle-link">
      {{ modo === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
      <a (click)="toggleModo()">{{ modo === 'login' ? 'Regístrate' : 'Inicia sesión' }}</a>
    </p>
  </div>
</div>
